# ============================================================
# Calm Dark Blue Frutiger Aero — Bliss
# Kitty / i3 / Xorg
# ============================================================

# Core terminal colors
background            #091c2b
foreground            #d3e4ee
cursor                #d8c85a
cursor_text_color     #091c2b
selection_background  #1c4660
selection_foreground  #e5f2f8

# Tab bar colors
active_tab_background   #091c2b
active_tab_foreground   #e0cf62
inactive_tab_background #061520
inactive_tab_foreground #55758a

# Normal colors (0-7)
color0  #061520
color1  #b94f5a
color2  #65965b
color3  #b9aa51
color4  #4d83a8
color5  #786d9a
color6  #4d9298
color7  #cbdde7

# Bright colors (8-15)
color8  #3a5565
color9  #d05d67
color10 #7caf6d
color11 #d3c45f
color12 #639fc5
color13 #9688b5
color14 #69afb2
color15 #e8f3f7


# Font settings
font_family      Iosevka
bold_font        Iosevka Bold
italic_font      Iosevka Italic
font_size        15.0

# --- Gestione URL e Sottolineatura Ondulata ---
url_style curly
open_url_with default
map ctrl+shift+o open_url_current_processing

scrollback_lines 10000

